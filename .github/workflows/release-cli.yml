name: Release CLI

on:
  push:
    tags:
      - "cli-v*"

permissions:
  contents: read

concurrency:
  group: release-cli-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Match the tag to the CLI version
        run: |
          version=$(bun -p 'require("./apps/cli/package.json").version')
          test "${GITHUB_REF_NAME#cli-v}" = "$version"

      - name: Verify workspace
        run: bun run check

  build:
    needs: verify
    strategy:
      matrix:
        include:
          - runner: macos-latest
            target: darwin-arm64
          - runner: macos-15-intel
            target: darwin-x64
          - runner: ubuntu-latest
            target: linux-x64
          - runner: ubuntu-24.04-arm
            target: linux-arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Check out repository
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Compile the binary on its own platform
        run: |
          bun build apps/cli/src/cli.ts --compile --minify \
            --outfile "dist/agentchannels-${{ matrix.target }}"

      - name: Smoke-test the binary outside the source tree
        run: |
          binary="$PWD/dist/agentchannels-${{ matrix.target }}"
          cd "$RUNNER_TEMP"
          "$binary" --help | grep -q '^Usage: agentchannels'
          test "$("$binary" --version)" = "${GITHUB_REF_NAME#cli-v}"

      - name: Upload the binary
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: agentchannels-${{ matrix.target }}
          path: dist/agentchannels-${{ matrix.target }}
          retention-days: 1

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download the binaries
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: dist
          merge-multiple: true

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd dist
          sha256sum agentchannels-* > SHA256SUMS
          gh release create "$GITHUB_REF_NAME" agentchannels-* SHA256SUMS \
            --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes
